<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>待办</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">待办</span>
      </div>
      <div class="side-actions">
        <select id="filter" title="按分类筛选">
          <option value="">全部分类</option>
        </select>
        <button id="btn-settings" class="icon" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 7.5h9.2M17.2 7.5H20M4 16.5h3.2M11.2 16.5H20" />
            <circle cx="15.2" cy="7.5" r="2.3" />
            <circle cx="9.2" cy="16.5" r="2.3" />
          </svg>
        </button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <div class="foot-row">
        <button id="btn-new" class="new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5.6v12.8M5.6 12h12.8" />
          </svg>
          <span>新建要点</span>
        </button>
        <div class="gen-wrap">
          <button id="btn-gen" class="gen">一键生成</button>
          <button id="btn-gen-menu" class="gen-arrow" title="选择时间范围" aria-label="选择时间范围">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 14.6l6-6 6 6" />
            </svg>
          </button>
          <div class="gen-menu" id="gen-menu" hidden>
            <button data-days="1">近 1 天</button>
            <button data-days="7">近 7 天</button>
            <button data-days="30">近 30 天</button>
          </div>
        </div>
      </div>
      <div id="gen-status" class="gen-status"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div class="crumb" id="crumb">待办</div>
      <div class="main-actions">
        <button id="btn-edit" class="ghost" hidden>编辑</button>
        <button id="btn-del" class="ghost danger" hidden>删除</button>
      </div>
    </div>
    <div class="main-body" id="body">
      <div class="empty">
        <div class="empty-mark"></div>
        <h1>还没有选中的要点</h1>
        <p>从左边挑一条，或者新建一条喵</p>
      </div>
    </div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <div class="modal-head" id="modal-title">新建要点</div>
    <div class="modal-body">
      <label>分类
        <select id="f-category">
          <option>通知</option><option>待办</option><option>学业</option>
          <option>活动</option><option>闲聊</option><option>其他</option>
        </select>
      </label>
      <label>群聊 / 好友
        <select id="f-group"><option value="">（不指定）</option></select>
      </label>
      <label>名称（可自定义；不填会自动取内容摘要）
        <input id="f-title" type="text" placeholder="例如：身份证复印件催交 / 东莞寻访组队" />
      </label>
      <label>日期
        <input id="f-date" type="date" />
      </label>
      <label class="grow">内容（每行一条要点，行首用「- 」会显示成列表）
        <textarea id="f-body" placeholder="- 第一条要点&#10;- 第二条要点&#10;&#10;支持插入：![图片](media/xxx.jpg)  [链接](https://...)  视频用 ![](media/xxx.mp4)"></textarea>
      </label>
      <div class="row wrap">
        <button id="btn-ins-img" class="ghost" type="button">插入图片</button>
        <button id="btn-ins-video" class="ghost" type="button">插入视频</button>
        <button id="btn-ins-link" class="ghost" type="button">插入链接</button>
      </div>
    </div>
    <div class="modal-foot">
      <button id="m-cancel" class="ghost">取消</button>
      <button id="m-save" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="settings" hidden>
  <div class="modal-box wide">
    <div class="modal-head">自动总结设置</div>
    <div class="modal-body">
      <p class="hint">勾选每天 20:00 要自动总结的群聊 / 好友喵。点「读取会话列表」会从微信里读一遍（微信要登录着）喵。</p>
      <div class="row">
        <button id="btn-load-chats" class="ghost">读取会话列表</button>
        <span id="chats-status" class="hint"></span>
      </div>
      <div class="row">
        <label style="flex:1">AI 密钥（DeepSeek）
          <input id="s-apikey" type="password" placeholder="sk-..." />
        </label>
        <label>模型
          <select id="s-model">
            <option value="deepseek-chat">deepseek-chat</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </select>
        </label>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="row spaced">
        <span id="last-run" class="hint"></span>
        <button id="btn-open-data" class="ghost">打开数据文件夹</button>
      </div>
    </div>
    <div class="modal-foot">
      <button id="s-cancel" class="ghost">取消</button>
      <button id="s-save" class="primary">保存</button>
    </div>
  </div>
</div>

<button id="fab" class="fab" title="选择微信群聊" aria-label="选择微信群聊">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.4 11.3a7.9 7.9 0 0 1-8.3 7.9 9 9 0 0 1-2.7-.4L4.6 20.3l1.5-4a7.7 7.7 0 0 1-1.4-4.4 7.9 7.9 0 0 1 8.2-8.2 7.9 7.9 0 0 1 7.5 7.6z" />
  </svg>
</button>

<div id="chat-panel" class="chat-panel" hidden>
  <div class="cp-head">
    <span>选择微信群聊</span>
    <button id="cp-close" class="cp-x" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
      </svg>
    </button>
  </div>
  <div class="cp-search">
    <input id="cp-q" type="search" placeholder="搜索群名…" />
  </div>
  <div class="cp-body" id="cp-list"></div>
  <div class="cp-foot">
    <span id="cp-status" class="hint"></span>
    <button id="cp-save" class="primary">保存</button>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
