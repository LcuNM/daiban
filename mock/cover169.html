<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1600px; height:900px; overflow:hidden; background:#f9f9f9; }
  body { font-family:"Microsoft YaHei","Microsoft YaHei UI",sans-serif; -webkit-font-smoothing:antialiased; }
  .stage { position:relative; width:1600px; height:900px; overflow:hidden; background:#F8F9FB; }
  .grid { position:absolute; inset:0; opacity:.55;
    background-image:linear-gradient(#E6E8EC 1px,transparent 1px),linear-gradient(90deg,#E6E8EC 1px,transparent 1px);
    background-size:56px 56px; }
  .wash { position:absolute; inset:0;
    background:radial-gradient(70% 90% at 78% 45%,rgba(120,170,255,.22) 0%,rgba(120,170,255,0) 60%); }
  .hero { position:absolute; right:150px; bottom:0; height:840px; z-index:4; }
  .hero img { height:100%; display:block; filter:drop-shadow(0 14px 30px rgba(40,70,130,.22)); }
  .left { position:absolute; left:80px; top:180px; z-index:6; }
  .tag { font-size:23px; color:#0E9C8A; font-weight:700; letter-spacing:1px; }
  h1 { margin-top:25px; font-size:112px; line-height:1.1; font-weight:900; color:#0A0C12; letter-spacing:2px; }
  .sub { margin-top:27px; font-size:34px; color:#2B313D; font-weight:700; line-height:1.5; }
  .feat { margin-top:25px; font-size:25px; color:#6A7285; font-weight:400; }
  .feat i { font-style:normal; margin-right:19px; }
  .hr { position:absolute; left:80px; top:761px; width:544px; height:1px; background:#D8DCE4; z-index:5; }
  .nav { position:absolute; left:80px; top:788px; font-size:19px; color:#9AA1AE; letter-spacing:.5px; z-index:5; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="wash"></div>
  <div class="hero"><img src="out/whale_full.png" alt=""></div>
  <div class="left">
    <div class="tag">待办 · chat-digest</div>
    <h1>群聊变要点</h1>
    <div class="sub">一键总结微信群聊<br>只留下真正要办的事</div>
    <div class="feat"><i>全程本地</i><i>每天自动</i><i>读完就删</i></div>
  </div>
  <div class="hr"></div>
  <div class="nav">为什么做 · 怎么用 · 界面 · 隐私 · 开源</div>
</div>
</body>
</html>
